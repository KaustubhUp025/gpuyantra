[project]
name = "kernelsmith"
version = "0.1.0"
description = "An in-process Google ADK agent tree that generates, verifies, and hot-swaps Triton GPU kernels into a live Qwen2.5-1.5B inference server."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kaustubh", email = "kaustubhme0@gmail.com" }]

# All versions pinned exactly per spec Section 0 (VERIFIED August 2026) and the
# reproducibility contract (spec Section 11: "Exact pins in pyproject.toml for ADK,
# torch, triton, transformers, CUDA"). Do not float these — the verifier, monkey-patch
# targets, and Vertex model IDs are all validated against these exact releases.
#
# Every DIRECT dependency below is `==`-pinned. The full transitive closure (127
# packages) is pinned by the committed `uv.lock`; `make setup` installs with
# `uv sync --frozen`, which refuses to re-resolve, so a fresh L4 gets byte-identical
# versions of the transitives too. Regenerate the lock deliberately with `uv lock`,
# never as a side effect. `uv lock --check` verifies lock and pyproject agree.
dependencies = [
    # --- Agents (ADK, in-process only) ---
    "google-adk==2.7.1",
    # --- GCP: Firestore memory + Gemini/embeddings ---
    "google-cloud-firestore==2.28.1",
    "google-genai==2.19.0",
    # --- GPU stack: torch 2.12.1 pins triton==3.7.1 on Linux (spec S0) ---
    "torch==2.12.1",
    "triton==3.7.1",
    "transformers==4.57.6",
    # device_map="cuda" in from_pretrained() imports accelerate; missing from spec S0.
    "accelerate==1.14.0",
    # --- Inference server ---
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "httpx==0.28.1",  # hotswap_tool -> POST /swap, and fastapi's TestClient
    # --- Dashboard ---
    "streamlit==1.62.0",
    "streamlit-autorefresh==1.0.1",  # 1 Hz whole-script rerun; the UI falls back to a button
    # Agent-tree diagram on the demo dashboard. NOTE: st.graphviz_chart renders a DOT
    # *string* in the browser, so demo_dashboard.py needs neither this package nor the
    # system graphviz binary at runtime — build_agent_graph() emits DOT text. Declared
    # per CLAUDE.md rule 16 for rendering the same DOT to a file offline; that path,
    # and only that path, also needs `apt-get install graphviz`.
    "graphviz==0.21",
    # --- Structured boundaries ---
    "pydantic==2.13.4",
    "numpy==2.4.6",  # latest numpy that still supports Python 3.11 (DLVM ships 3.11)
    # kernelsmith/__init__.py loads .env before config.py reads os.environ. Already a
    # transitive of google-adk and streamlit; declared because we import it directly.
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.4",
    # tests/test_integration.py imports google.auth.default() directly to detect the
    # Compute Engine metadata server; declared so it is not an accidental transitive.
    "google-auth==2.56.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kernelsmith"]

[tool.uv]
# torch/triton wheels are Linux-only; the target is a g2-standard-4 (NVIDIA L4).
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires GPU and live Vertex AI / Firestore",
    "chaos: fault-injection tests (subprocess kills, OOM, rate limits)",
]
